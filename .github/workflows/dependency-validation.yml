name: Dependency validation
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: python:3.12.15-slim@sha256:a0f57064cbdcd6285fa45f51237ab0b35ea8ebaed06a1f5973e89e19dfb86704
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install validation tooling
        run: python -m pip install uv==0.11.17
      - name: Install locked dependencies
        run: |
          uv sync --locked --all-extras --python /usr/local/bin/python
          uv pip check
      - name: Validate offline behavior
        run: uv run --no-project --python .venv/bin/python python tests/offline_validation.py
